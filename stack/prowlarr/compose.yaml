# Prowlarr indexer manager (unit 7). Deployed by stack/deploy.sh (-f after stack/compose.yaml, project media-stack).
# UI http://<vm-ip>:9696. Forms auth; the API key comes from secrets.env (op inject of secrets.env.tpl).
services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:3.0.2.5780-ls169
    container_name: prowlarr
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-America/Chicago}
      - UMASK=${UMASK:-002}
      - PROWLARR__AUTH__METHOD=Forms
      - PROWLARR__AUTH__REQUIRED=DisabledForLocalAddresses
    # deploy.sh passes this file with -f after stack/compose.yaml, so the path is relative to stack/
    env_file:
      - path: prowlarr/secrets.env
        required: false
    ports:
      - "9696:9696"
    volumes:
      - ${CONFIG_ROOT:?CONFIG_ROOT not set}/prowlarr:/config
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9696/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

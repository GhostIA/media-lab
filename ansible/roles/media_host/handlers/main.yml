---
# Only a daemon-reload: the docker drop-in adds a mount dependency, which takes effect without
# restarting docker (and the running containers).
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Only for the max-block-size drop-in (it takes effect at nfsd start). Clients on a hard mount just
# wait out the restart and the 90 s NFSv4 grace period.
- name: Restart NFS server
  ansible.builtin.systemd_service:
    name: nfs-server
    state: restarted
    daemon_reload: true

# Re-reads /etc/exports(.d) without restarting nfs-server; mounted clients are not interrupted.
- name: Reload NFS exports
  ansible.builtin.command: exportfs -ra
  changed_when: true

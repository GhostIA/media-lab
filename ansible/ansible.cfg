# Ansible config for media-lab; run ansible / ansible-playbook from this directory (ansible/).
[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
forks = 10
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o IdentityAgent=none -o ConnectTimeout=10
pipelining = True

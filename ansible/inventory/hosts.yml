# Inventory: the 5 PVE nodes of cluster "media" plus the media stack VM (key auth, see playbooks/ssh-keys.yml).
all:
  vars:
    ansible_ssh_private_key_file: ~/.ssh/id_ed25519
  children:
    pve_nodes:
      vars: {ansible_user: root}
      hosts:
        intel-1ecbc8: {ansible_host: 192.168.8.234}
        intel-a163f8: {ansible_host: 192.168.8.123, pve_nic_offload_off: [eno1]}   # e1000e hang fix
        intel-177e78: {ansible_host: 192.168.8.162}
        intel-91c45d: {ansible_host: 192.168.8.196, pve_nic_offload_off: [eno1]}   # e1000e hang fix
        intel-d1babf: {ansible_host: 192.168.8.194}
    ceph_mons:
      hosts: {intel-1ecbc8: {}, intel-a163f8: {}, intel-177e78: {}}
    ceph_osds:
      hosts:
        intel-1ecbc8: {ceph_osd_serials: [TPBF2312190010600040]}
        intel-177e78: {ceph_osd_serials: [W8002A8K]}
        intel-91c45d: {ceph_osd_serials: [WY21Q28J]}
        intel-d1babf: {ceph_osd_serials: [ZDZG29LG]}
    # Two Docker VMs, one Compose project definition (stack/). media_stack_host_services picks what
    # each VM runs. VM 200 keeps the data disk and everything that hardlinks on it (downloaders,
    # *arrs); VM 201 mounts /data over NFS from VM 200 and runs the rest.
    media_vms:
      vars: {ansible_user: media, ansible_become: true}
      hosts:
        media-stack:
          ansible_host: 192.168.8.200
          media_host_nfs_clients: ["{{ media_apps_vm.ip }}"]
          media_stack_host_services: [qbittorrent, qbittorrent-lidarr, sonarr, radarr, lidarr, cleanuparr]
        media-apps:
          ansible_host: 192.168.8.201
          media_host_data_source: nfs
          media_stack_host_services: [jellyfin, aurral, seerr, prowlarr, flaresolverr]

---
# Create/fill the 1Password item that holds the media stack's app secrets (replaces
# stack/secrets-init.sh). Safe to rerun: only fields that are missing (or empty) are added;
# existing values are never overwritten, and secret values are never printed or passed on a
# command line (they reach `op` on stdin only). Runs on the Mac; needs `op` signed in.
# Uses one `op item get` per run when nothing is missing (one 1Password authorization).
#
# usage (from ansible/):
#   ansible-playbook playbooks/secrets-init.yml [--check]
#   ansible-playbook playbooks/secrets-init.yml -e secrets_init_item=media-stack-test   # testing only
#
# Item "media-stack" (category API Credential) in vault op_vault ("Lab"), concealed fields:
#   sonarr_api_key radarr_api_key lidarr_api_key prowlarr_api_key   32 lowercase hex chars
#   aurral_api_key                                                  64 lowercase hex chars
#   qbittorrent_password qbittorrent_lidarr_password                32 random letters/digits
# Reference them as op://<op_vault>/media-stack/<field> (e.g. in stack/<svc>/secrets.env.tpl).
- name: Ensure the media-stack 1Password item has every app secret
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    secrets_init_item: media-stack
    # field -> generator: hex = 32 lowercase hex chars, hex64 = 64 (Aurral needs >= 32),
    # password = 32 letters/digits
    secrets_init_fields:
      sonarr_api_key: hex
      radarr_api_key: hex
      lidarr_api_key: hex
      prowlarr_api_key: hex
      aurral_api_key: hex64
      qbittorrent_password: password
      qbittorrent_lidarr_password: password
    secrets_init_charsets:
      hex: ["0123456789abcdef"]
      hex64: ["0123456789abcdef"]
      password: [ascii_letters, digits]
    secrets_init_lengths:
      hex: 32
      hex64: 64
      password: 32
  tasks:
    - name: Read the item
      ansible.builtin.command:
        argv: [op, item, get, "{{ secrets_init_item }}", --vault, "{{ op_vault }}", --format, json]
      register: secrets_init_get
      changed_when: false
      check_mode: false
      failed_when: secrets_init_get.rc != 0 and "isn't an item" not in secrets_init_get.stderr | default('')
      no_log: true

    - name: Fail if 1Password could not be read
      ansible.builtin.fail:
        msg: "op item get failed (rc={{ secrets_init_get.rc }}); is 1Password unlocked and vault {{ op_vault }} accessible?"
      when: secrets_init_get.rc != 0 and "isn't an item" not in secrets_init_get.stderr | default('')

    - name: Parse the item
      ansible.builtin.set_fact:
        secrets_init_exists: "{{ secrets_init_get.rc == 0 }}"
        secrets_init_json: "{{ secrets_init_get.stdout | from_json if secrets_init_get.rc == 0 else {} }}"
      no_log: true

    - name: Find missing or empty fields (names only)
      ansible.builtin.set_fact:
        secrets_init_missing: >-
          {{ secrets_init_fields.keys()
             | difference(secrets_init_json.fields | default([])
                          | selectattr('value', 'defined') | selectattr('value')
                          | map(attribute='label'))
             | list }}

    - name: Generate values for the missing fields (in memory only)
      ansible.builtin.set_fact:
        secrets_init_new_fields: >-
          {{ secrets_init_new_fields | default([])
             + [{'id': item, 'label': item, 'type': 'CONCEALED',
                 'value': lookup('ansible.builtin.password', '/dev/null', length=secrets_init_lengths[secrets_init_fields[item]],
                                 chars=secrets_init_charsets[secrets_init_fields[item]])}] }}
      loop: "{{ secrets_init_missing }}"
      no_log: true

    - name: Add the missing fields to the existing item (other fields kept as they are)
      ansible.builtin.command:
        argv: [op, item, edit, "{{ secrets_init_item }}", --vault, "{{ op_vault }}"]
        stdin: >-
          {{ secrets_init_json
             | combine({'fields': (secrets_init_json.fields | default([])
                                   | rejectattr('label', 'in', secrets_init_missing) | list)
                                  + secrets_init_new_fields})
             | to_json }}
      when: secrets_init_exists and secrets_init_missing | length > 0
      changed_when: true
      no_log: true

    - name: Create the item with every field
      ansible.builtin.command:
        argv: [op, item, create, --vault, "{{ op_vault }}", "-"]
        stdin: >-
          {{ {'title': secrets_init_item, 'category': 'API_CREDENTIAL', 'fields': secrets_init_new_fields}
             | to_json }}
      when: not secrets_init_exists
      changed_when: true
      no_log: true

    - name: Read the item back after a change
      ansible.builtin.command:
        argv: [op, item, get, "{{ secrets_init_item }}", --vault, "{{ op_vault }}", --format, json]
      register: secrets_init_reread
      when: secrets_init_missing | length > 0 and not ansible_check_mode
      changed_when: false
      no_log: true

    - name: Check the format of every value (names only)
      ansible.builtin.set_fact:
        secrets_init_bad: >-
          {{ (secrets_init_fields.keys() | difference(secrets_init_values.keys()) | list)
             + (secrets_init_values | dict2items
                | selectattr('key', 'in', secrets_init_kind.hex)
                | rejectattr('value', 'match', '^[0-9a-f]{32}$') | map(attribute='key') | list)
             + (secrets_init_values | dict2items
                | selectattr('key', 'in', secrets_init_kind.hex64)
                | rejectattr('value', 'match', '^[0-9a-f]{64}$') | map(attribute='key') | list)
             + (secrets_init_values | dict2items
                | selectattr('key', 'in', secrets_init_kind.password)
                | rejectattr('value', 'match', '^.{24,}$') | map(attribute='key') | list) }}
      vars:
        secrets_init_final: >-
          {{ secrets_init_reread.stdout | from_json if secrets_init_reread is not skipped else secrets_init_json }}
        secrets_init_values: >-
          {{ secrets_init_final.fields | default([]) | selectattr('value', 'defined') | selectattr('value')
             | items2dict(key_name='label', value_name='value') }}
        secrets_init_kind:
          hex: "{{ secrets_init_fields | dict2items | selectattr('value', 'eq', 'hex') | map(attribute='key') | list }}"
          hex64: "{{ secrets_init_fields | dict2items | selectattr('value', 'eq', 'hex64') | map(attribute='key') | list }}"
          password: "{{ secrets_init_fields | dict2items | selectattr('value', 'eq', 'password') | map(attribute='key') | list }}"
      when: not ansible_check_mode or secrets_init_missing | length == 0
      no_log: true

    - name: Report what check mode would add
      ansible.builtin.debug:
        msg: "check mode: would {{ 'add' if secrets_init_exists else 'create item with' }} {{ secrets_init_missing | join(' ') }}"
      when: ansible_check_mode and secrets_init_missing | length > 0

    - name: Every reference resolves and looks right
      ansible.builtin.assert:
        that: secrets_init_bad | length == 0
        fail_msg: "missing, empty or badly formatted: {{ secrets_init_bad | join(' ') }}"
        success_msg: "{{ secrets_init_item }}: {{ secrets_init_fields.keys() | join(' ') }} ok"
      when: not ansible_check_mode or secrets_init_missing | length == 0

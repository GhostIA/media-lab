# Sonarr (TV + anime). stack/deploy.sh passes it with -f after the root stack/compose.yaml
# (project "media-stack"). Host paths come only from ${DATA_ROOT} / ${CONFIG_ROOT} (stack/.env.example).
# secrets.env is generated on the VM at deploy time from secrets.env.tpl (op inject); it is optional
# so `docker compose config` validates without it (Sonarr then generates its own API key).
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls5
    container_name: sonarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      UMASK: ${UMASK:-002}
      # Forms login, no prompt from LAN addresses; a later OIDC reverse proxy can sit in front.
      SONARR__AUTH__METHOD: Forms
      SONARR__AUTH__REQUIRED: DisabledForLocalAddresses
    env_file:
      # relative to stack/ (the project dir), since deploy.sh merges service files with -f
      - path: sonarr/secrets.env
        required: false
    ports:
      - "8989:8989"
    volumes:
      - ${CONFIG_ROOT:?CONFIG_ROOT not set}/sonarr:/config
      - ${DATA_ROOT:?DATA_ROOT not set}:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

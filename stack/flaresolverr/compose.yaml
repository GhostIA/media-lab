# FlareSolverr: solves Cloudflare/DDoS-Guard challenges for Prowlarr (indexer proxy). Merged into the
# media-stack project by ansible/playbooks/media-stack.yml (`-f flaresolverr/compose.yaml`).
# Only Prowlarr talks to it, over the compose network (http://flaresolverr:8191), so no host port is
# published. No volumes: it is stateless. See stack/flaresolverr/README.md.
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      TZ: ${TZ:-America/Chicago}
      LOG_LEVEL: info
    expose:
      - "8191"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8191/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

---
# One entry per *arr app. The role GETs <url>/api/<api_version>/rootfolder and POSTs only the
# folders whose path is missing (trailing "/" ignored), then adds/fixes the qBittorrent download
# client (tasks/download_client.yml).
#   app          name; the API key is the 1Password field "<app>_api_key" of item
#                arr_config_op_item in vault op_vault (same key the container gets via secrets.env)
#   url          base URL, no trailing slash
#   api_version  v3 (Sonarr/Radarr) or v1 (Lidarr)
#   folders      list of POST bodies; each needs "path", other keys are sent as-is (e.g. "name")
#   download_client  {category_field, category}: the qBittorrent category this app's download client
#                sends grabs to; category_field is the field name in the app's QBittorrent schema
#                (GET /api/<v>/downloadclient/schema). Omit to leave the app's download clients alone.
#                Optional client: keys merged over arr_config_download_client for this app only
#                (name, host, port, username, password_field), e.g. a dedicated qBittorrent instance.
#   extra.body      keys merged into every POST body of this app
#   extra.profiles  {<body key>: {endpoint, name}}: the id of the profile called <name> from
#                   GET /api/<v>/<endpoint>, else the lowest id; only looked up when a POST is needed
arr_config_apps:
  - app: sonarr
    url: "http://{{ media_vm.ip }}:8989"
    api_version: v3
    folders:
      - {path: /data/media/tv}
      - {path: /data/media/anime}
    # One client, category tv, also for anime series. Routing anime to the qBittorrent "anime"
    # category would need a second client (category anime) restricted to a series tag "anime".
    download_client: {category_field: tvCategory, category: tv}
    extra: {}
  - app: radarr
    url: "http://{{ media_vm.ip }}:7878"
    api_version: v3
    folders:
      - {path: /data/media/movies}
    download_client: {category_field: movieCategory, category: movies}
    extra: {}
  - app: lidarr
    url: "http://{{ media_vm.ip }}:8686"
    api_version: v1
    folders:
      - {path: /data/media/music, name: Music}
    # Lidarr has its own qBittorrent instance (stack/qbittorrent-lidarr). The old shared client
    # "qBittorrent" is no longer managed for Lidarr: it was left at priority 50 so grabs already
    # queued there still import; delete it in Lidarr once that queue is empty.
    download_client:
      category_field: musicCategory
      category: music
      client:
        name: qBittorrent (Lidarr)
        host: qbittorrent-lidarr
        port: 8081
        password_field: qbittorrent_lidarr_password
    extra:
      body:
        defaultMonitorOption: all
        defaultNewItemMonitorOption: all
        defaultTags: []
      profiles:
        defaultQualityProfileId: {endpoint: qualityprofile, name: Any}
        defaultMetadataProfileId: {endpoint: metadataprofile, name: Standard}

# qBittorrent download client added to every app with a download_client entry (matched by name),
# unless the app's download_client.client overrides some keys. host is the compose service name:
# the apps reach qBittorrent on the media-stack network. password_field is the 1Password field of
# arr_config_op_item holding the WebUI password.
arr_config_download_client:
  name: qBittorrent
  host: qbittorrent
  port: 8080
  username: admin
  password_field: qbittorrent_password

# 1Password item holding the <app>_api_key and qbittorrent_password fields (vault: op_vault from group_vars/all.yml).
arr_config_op_item: media-stack

# Wait for GET <url>/ping: retries x (delay + up to timeout) seconds, i.e. 60-150s. An app still
# down after that is skipped with a message (the run then fails only if fail_on_unreachable is true).
arr_config_ping_retries: 30
arr_config_ping_delay: 2
arr_config_ping_timeout: 3
arr_config_fail_on_unreachable: false

# HTTP timeout per API call, seconds.
arr_config_timeout: 20

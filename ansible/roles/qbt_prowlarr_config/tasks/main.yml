---
# Runs on the controller (API calls over the LAN, 1Password via the local `op` CLI).
- name: Read the stack credentials from 1Password
  ansible.builtin.set_fact:
    qbt_prowlarr_config_secrets: >-
      {{ lookup('community.general.onepassword_raw', qbt_prowlarr_config_op_item, vault=op_vault).fields
         | selectattr('value', 'defined') | items2dict(key_name='label', value_name='value') }}
  no_log: true
  tags: [always]

- name: Check that the qBittorrent password is in 1Password
  ansible.builtin.assert:
    that: qbt_prowlarr_config_secrets.qbittorrent_password | default('') | length > 0
    fail_msg: "1Password item {{ qbt_prowlarr_config_op_item }} has no value for qbittorrent_password"
    quiet: true
  tags: [always]

- name: Configure qBittorrent
  ansible.builtin.import_tasks: qbittorrent.yml
  tags: [qbittorrent]

- name: Configure Prowlarr
  ansible.builtin.import_tasks: prowlarr.yml
  tags: [prowlarr]

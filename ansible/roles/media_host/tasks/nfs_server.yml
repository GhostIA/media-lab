---
# Export /data to the VMs listed in media_host_nfs_clients (only on the VM with the data disk).
# root_squash (the default) stays on: every app runs as PUID:PGID, which is the same uid/gid on
# both VMs, so no client ever needs root on the share.
- name: Install the NFS server
  ansible.builtin.apt:
    name: nfs-kernel-server
    state: present
    update_cache: true
    cache_valid_time: 3600

# exportfs reads /etc/exports.d/*.exports, but Debian does not create the directory
- name: Create /etc/exports.d
  ansible.builtin.file:
    path: /etc/exports.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Export /data to the NFS clients
  ansible.builtin.copy:
    dest: /etc/exports.d/media-data.exports
    content: |
      # managed by ansible (media_host role, nfs_server.yml)
      {{ media_host_data_root }} {% for c in media_host_nfs_clients %}{{ c }}({{ media_host_nfs_export_opts }}){{ ' ' if not loop.last else '' }}{% endfor %}

    owner: root
    group: root
    mode: "0644"
  notify: Reload NFS exports

# nfsd sizes its maximum block from RAM at start (3.5 GiB VM -> 512 KiB). A client that mounted while
# the limit was 1 MiB keeps rsize/wsize 1 MiB, and after a resize/reboot every request is rejected
# ("nfsd RPC fragment too large") while the hard mount just hangs. Pin it; it can only be written
# while nfsd is stopped, hence ExecStartPre.
- name: Create the nfs-server.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nfs-server.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Pin the nfsd maximum block size
  ansible.builtin.copy:
    dest: /etc/systemd/system/nfs-server.service.d/max-block-size.conf
    content: |
      [Service]
      ExecStartPre=/bin/sh -c 'echo {{ media_host_nfs_max_block_size }} > /proc/fs/nfsd/max_block_size'
    owner: root
    group: root
    mode: "0644"
  notify: Restart NFS server

- name: Enable and start the NFS server
  ansible.builtin.systemd_service:
    name: nfs-server
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Apply the export before any client mounts it
  ansible.builtin.meta: flush_handlers

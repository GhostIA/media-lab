---
# Read-only cluster-readiness report of every PVE node: fqdn, pveversion, cluster
# (name/nodes/quorate), guests, storage, /etc/hosts, network, time sync, apt repos.
# Changes nothing (every task is changed_when: false and also runs under --check).
# Replaces pve-tools/inventory.sh.
# usage (from ansible/):
#   ansible-playbook playbooks/inventory-report.yml [--limit intel-a163f8]
- name: PVE node inventory report
  hosts: pve_nodes
  gather_facts: false
  tasks:
    - name: Collect report fields
      ansible.builtin.shell:
        cmd: "{{ item.value }}"
        executable: /bin/bash
      loop: "{{ inventory_report_cmds | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      register: inventory_report_raw
      changed_when: false
      failed_when: false
      check_mode: false
      vars:
        inventory_report_cmds:
          fqdn: hostname -f
          pveversion: pveversion
          cluster: pvecm status 2>&1 | grep -E '^Name:|Nodes:|Quorate:|Error'
          guests: >-
            { qm list 2>/dev/null | awk 'NR>1{printf "vm%s(%s) ", $1,$3}';
            pct list 2>/dev/null | awk 'NR>1{printf "ct%s(%s) ", $1,$2}'; }
          storage: pvesm status 2>/dev/null | awk 'NR>1{print $1,$2,$3}'
          hosts: grep -Ev '^#|^$|::|ip6' /etc/hosts
          net: ip -br a | grep -Ev '^(lo|tap|fwbr|fwpr|fwln|veth)'
          time: timedatectl | grep -i synchronized
          repos: >-
            grep -rh '^URIs\|^Components\|^deb\|^Enabled' /etc/apt/sources.list
            /etc/apt/sources.list.d/ 2>/dev/null | sort -u

    - name: Print report
      ansible.builtin.debug:
        msg: >-
          {{ dict(inventory_report_raw.results
                  | map(attribute='item.key')
                  | zip(inventory_report_raw.results
                        | map(attribute='stdout_lines')
                        | map('map', 'trim') | map('list'))) }}
